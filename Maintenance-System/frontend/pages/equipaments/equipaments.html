<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Sistema de Manutenção</title>
</head>

<style>#equipmentsTable tr {
  cursor: pointer;
}</style>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h4 class="text-white fs-5 mb-4">Menu</h4>
                <nav class="nav flex-column">
                    <a class="nav-link text-white px-0 active" href="/dashboard" data-route="/dashboard">Dashboard</a>
                    <a class="nav-link text-white px-0" href="/maintanence" data-route="/maintanence">Manutenção</a>
                    <a class="nav-link text-white px-0" href="/technicians" data-route="/technicians">Técnicos</a>
                </nav>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-4 align-items-center justify-content-between">
                            <div class="col-md-8">
                                <div class="input-group">
                                    <input id="searchInput" type="text" class="form-control"
                                        placeholder="Pesquisar equipamento...">
                                    <button type="button" id="searchButton" class="btn btn-primary">
                                        Pesquisar
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4 text-md-end">
                                <div class="btn-group" role="group">
                                    <button id="newEquipament" type="button" class="btn btn-success"
                                        data-bs-toggle="modal" data-bs-target="#modalNovoEquipamento">Novo</button>
                                    <button type="button" class="btn btn-primary">Editar</button>
                                    <button id="deleteButton" type="button" class="btn btn-danger">Excluir</button>
                                </div>
                            </div>
                            <p id="error-message" class="error text-danger text-center small mt-3 mb-0"></p>
                            <p id="success-message" class="success text-success text-center small mt-3 mb-0"></p>

                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Equipamento</th>
                                        <th>Local</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="equipmentsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div class="modal fade" id="modalNovoEquipamento" tabindex="-1" aria-labelledby="modalNovoEquipamentoLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNovoEquipamentoLabel">Novo Equipamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="formNovoEquipamento">
                        <div class="mb-3">
                            <label for="nomeEquipamento" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nameEquipment"
                                placeholder="Digite o nome do equipamento" required>
                        </div>
                        <div class="mb-3">
                            <label for="statusEquipamento" class="form-label">Status</label>
                            <select class="form-select" id="statusEquipment" required>
                                <option value="" selected disabled>Selecione o status</option>
                                <option value="ATIVO">Ativo</option>
                                <option value="MANUTENCAO">Em Manutenção</option>
                                <option value="MANUTENCAO_PREV">Inativo</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="patrymony" class="form-label">Numero do patrimônio</label>
                            <input class="form-control" id="patrymony" placeholder="Digite o patrimônio" required>
                        </div>
                        <div class="mb-3">
                            <label for="dataAquisicao" class="form-label">Data da Aquisição</label>
                            <input type="date" class="form-control" id="dateAcquisition" required>
                        </div>
                        <div class="mb-3">
                            <label for="localEquipamento" class="form-label">Local</label>
                            <input type="text" class="form-control" id="locationEquipment" placeholder="Digite o local"
                                required>
                        </div>
                        <p id="error-message" class="error text-danger text-center small mt-3 mb-0"></p>
                        <p id="success-message" class="success text-success text-center small mt-3 mb-0"></p>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button id="saveEquipament" type="submit" form="formNovoEquipamento"
                        class="btn btn-primary">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted py-2 mt-1 border-top">
        <p class="mb-0 small">2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
    </footer>
</body>

</html>

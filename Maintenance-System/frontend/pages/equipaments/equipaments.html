<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema de Manutenção</title>
    <link rel="stylesheet" href="../css//dashboard.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body class="bg-light">

    <div class="container-fluid">

        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100">
                <nav class="nav flex-column">
                    <a class="nav-link text-white">Dashboard</a>
                    <a class="nav-link text-white">Equipamento</a>
                    <a class="nav-link text-white">Categorias</a>
                    <a class="nav-link text-white">Tecnicos</a>
                </nav>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <form class="row g-3 mb-4">
                    <div class="col-md-8">
                        <input id="searchInput" type="text" class="form-control" placeholder="Pesquisar equipamento">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100">
                            Pesquisar
                        </button>
                    </div>
                </form>

                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6>Equipamentos Ativos</h6>
                                <h2 id="activesTotal">10</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6>Manutenção Preventiva</h6>
                                <h2 id="preventiveTotal">15</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6>Em Manutenção</h6>
                                <h2 id="maintenceEquipamentsTotal">12</h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Equipamento</th>
                                <th>Local</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="equipmentsTable">
                            <tr>
                                <td>Empacotadora</td>
                                <td>Setor Peru A1</td>
                                <td>Ativo</td>
                            </tr>
                            <tr>
                                <td>Empacotadora Bandeja</td>
                                <td>Setor Peru A1</td>
                                <td>Manutenção</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="row">
                    <button id="btnNewEquipament" class="btn btn-primary">Novo Equipamento</button>
                </div>
            </main>
        </div>

        <div class="modal fade" id="equipamentModel" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            Novo equipamento
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal">
                        </button>
                    </div>
                    <div class="modal-body">
                        <input type="text" id="equipamentName" class="form-control" placeholder="Nome Equipamento">
                        <button type="button" id="btnSaveEquipament" class="btn btn-success">Salvar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
    </footer>
</body>

</html>

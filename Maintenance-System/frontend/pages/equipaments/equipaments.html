<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema de Manutenção</title>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100">
                <nav>
                    <a href="/dashboard" data-route="/dasbooard">Dashboard</a>
                    <a href="/maintanence" data-route="/maintanence">Manutenção</a>
                    <a href="/technicians" data-route="/technicians">Tecnicos</a>
                </nav>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <form class="row g-3 mb-4">
                    <div class="col-md-8">
                        <input id="searchInput" type="text" class="form-control" placeholder="Pesquisar equipamento">
                    </div>
                    <div class="col-md-4">
                        <button type="button" id="searchButton" class="btn btn-primary w-100">
                            Pesquisar
                        </button>
                    </div>
                </form>
                <div class="row">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Equipamento</th>
                                <th>Local</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="equipmentsTable"></tbody>
                    </table>
                </div>
                <p id="error-message" class="error text-danger text-center small mt-3 mb-0"></p>
            </main>
        </div>
    </div>

    <footer>
        <p>2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
    </footer>
</body>

</html>

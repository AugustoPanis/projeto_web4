<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Sistema de Manutenção</title>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <aside class="col-auto bg-dark text-white min-vh-100 p-2 d-flex flex-column" style="width: 130px;"> 
                <h4 class="text-white fs-5 mb-4">Menu</h4>
                <nav class="nav flex-column">
                    <a class="nav-link text-white px-0 active" href="/equipment">Equipamentos</a>
                    <a class="nav-link text-white px-0" href="/maintanence">Manutenção</a>
                    <a class="nav-link text-white px-0" href="/technicians">Técnicos</a>
                </nav>
                    <button id="logoutButton" type="button" class="nav-link text-white px-0 py-1 mt-auto d-flex align-items-center gap-1 small" title="Sair" aria-label="Sair">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z" />
                        <path fill-rule="evenodd"
                            d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z" />
                    </svg>
                    <span>Sair</span>
                </button>
            </aside>
            <main class="col p-4">
                <div class="card shadow-sm mb-5">
                    <div class="card-body">
                        <div class="row g-3 align-items-center">
                            <div class="col">
                                <div class="input-group">
                                    <form id="search-form" class="input-group">
                                        <input id="searchInput" type="text" class="form-control"
                                            placeholder="Pesquisar equipamento...">
                                        <button type="submit" id="searchButton"
                                            class="btn btn-primary">Pesquisar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted mb-2">Equipamentos Ativos</h6>
                                <h2 id="activesTotal" class="mb-0"></h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted mb-2">Manutenção Preventiva</h6>
                                <h2 id="preventiveTotal" class="mb-0"></h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted mb-2">Em Manutenção</h6>
                                <h2 id="maintenanceTotal" class="mb-0"></h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Equipamento</th>
                                        <th>Local</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <footer class="text-center text-muted py-3 mt-1 border-top">
        <p class="mb-0 small">2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
    </footer>
    <div id="toast-container" class="toast-container-custom" aria-live="polite" aria-atomic="true"></div>
</body>

</html>

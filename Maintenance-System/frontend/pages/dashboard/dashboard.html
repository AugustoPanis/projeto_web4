    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - Sistema de Manutenção</title>
        <link rel="stylesheet" href="../css//dashboard.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/forms.css">
    </head>
    <body class="bg-light">

        <div class="container-fluid">

            <div class="row">
                <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100">
                    <nav class="nav flex-column">
                        <a class="nav-link text-white active">Dashboard</a>
                        <a class="nav-link text-white">Equipamento</a>
                        <a class="nav-link text-white">Categorias</a>
                        <a class="nav-link text-white">Tecnicos</a>
                    </nav>
                </aside>
                <main class="col-md-9 col-lg-10 p-4">
                    <form class="row g-3 mb-4">
                        <div class="col-md-8">
                            <input id="searchInput" type="text" class="form-control" placeholder="Pesquisar equipamento">
                        </div>
                        <div class="col-md-4">
                            <button type="button" id="searchButton" class="btn btn-primary w-100">
                                Pesquisar
                            </button>
                        </div>
                    </form>

                    <div class="row g-4 mb-4">
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Equipamentos Ativos</h6>
                                    <h2 id="activesTotal">2</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Manutenção Preventiva</h6>
                                    <h2 id="preventiveTotal"></h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Em Manutenção</h6>
                                    <h2 id="maintenceEquipamentsTotal"></h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Equipamento</th>
                                    <th>Local</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="equipmentsTable"></tbody>
                        </table>
                    </div>
                    <p id="error-message" class="error text-danger text-center small mt-3 mb-0"></p>
                </main>
            </div>
        </div>

        <footer>
            <p>2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
        </footer>
    </body>
    </html>

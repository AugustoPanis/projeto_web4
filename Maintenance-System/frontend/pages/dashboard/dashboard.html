<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Sistema de Manutenção</title>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">
                <h4 class="text-white fs-5 mb-4">Menu</h4>
                <nav class="nav flex-column">
                    <a class="nav-link text-white px-0 active" href="/equipment" data-route="/equipment">Equipamentos</a>
                    <a class="nav-link text-white px-0" href="/maintanence" data-route="/maintanence">Manutenção</a>
                    <a class="nav-link text-white px-0" href="/technicians" data-route="/technicians">Tecnicos</a>
                </nav>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-center">
                            <div class="col">
                                <div class="input-group">
                                    <form id="search-form" class="input-group">
                                        <input id="searchInput" type="text" class="form-control"
                                            placeholder="Pesquisar equipamento...">
                                        <button type="submit" id="searchButton"
                                            class="btn btn-primary">Pesquisar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted mb-2">Equipamentos Ativos</h6>
                                <h2 id="activesTotal" class="mb-0"></h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted mb-2">Manutenção Preventiva</h6>
                                <h2 id="preventiveTotal" class="mb-0"></h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h6 class="text-muted mb-2">Em Manutenção</h6>
                                <h2 id="maintenanceTotal" class="mb-0"></h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Equipamento</th>
                                        <th>Local</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="equipmentsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <footer class="text-center text-muted py-3 mt-1 border-top">
        <p class="mb-0 small">2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
    </footer>
    <div id="toast-container" class="toast-container-custom" aria-live="polite" aria-atomic="true"></div>
</body>

</html>

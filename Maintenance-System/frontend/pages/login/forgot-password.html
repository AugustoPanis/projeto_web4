<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance System</title>
</head>

<body class="bg-light m-0">

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <main class="login-container w-100" style="max-width: 400px;">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h2 class="card-title text-center text-primary mb-4 fw-bold">Recuperar Senha</h2>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label text-secondary small fw-semibold">E-mail</label>
                            <input type="email" id="email" class="form-control" placeholder="seu@email.com" required
                                autocomplete="username">
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" id="btn-forgotPassword" class="btn btn-primary fw-semibold">
                                Esqueceu a senha?
                            </button>
                            <button type="button" id="btn-signIn" class="btn btn-outline-secondary fw-semibold">
                                    Voltar para login
                            </button>
                            </div>

                            <p id="error-message" class="error text-danger text-center small mt-3 mb-0"></p>
                            <p id="success-message" class="success text-success text-center small mt-3 mb-0"></p>
                    </form>
                </div>
            </div>
        </main>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Maintenance System</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<main class="login-container">
    <form id="login-form">
        <h2>Acesso ao Sistema</h2>
        <label for="name">Nome</label>
        <input type="text" id="name" required autocomplete="username">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" required autocomplete="username">

        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Senha</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit" id="btn-singUp">
            Cadastrar-se
        </button>
        <button type="submit" id="btn-singIn">
            Voltar para login
        </button>
        <p id="error-message" class="error"></p>
       <p id="success-message" class="success"></p>

    </form>
</main>

</html>
